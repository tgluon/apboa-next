{{/*
敏感配置集中放置：首次安装自动生成随机值，后续 upgrade 从集群中的 Secret 复用，
避免每次升级轮换密码导致中间件连接失败（等价 compose 的 .env 持久化）。
*/}}
{{- $secretName := include "apboa.secretName" . -}}
{{- $prev := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
{{- $prevData := dict -}}
{{- if $prev -}}
{{- $prevData = $prev.data | default dict -}}
{{- end -}}

{{/* ---------- MySQL root 密码 ---------- */}}
{{- $mysqlRootPwd := .Values.middleware.mysql.auth.rootPassword -}}
{{- if not $mysqlRootPwd -}}
{{- $mysqlRootPwd = (get $prevData "MYSQL_ROOT_PASSWORD" | default "" | b64dec) -}}
{{- end -}}
{{- if not $mysqlRootPwd -}}
{{- $mysqlRootPwd = randAlphaNum 24 -}}
{{- end -}}

{{/* ---------- MySQL 应用账号密码 ---------- */}}
{{- $mysqlPwd := "" -}}
{{- if .Values.middleware.mysql.enabled -}}
{{- $mysqlPwd = .Values.middleware.mysql.auth.password -}}
{{- if not $mysqlPwd -}}
{{- $mysqlPwd = $mysqlRootPwd -}}
{{- end -}}
{{- else -}}
{{- $mysqlPwd = .Values.external.mysql.password -}}
{{- end -}}
{{- if not $mysqlPwd -}}
{{- $mysqlPwd = (get $prevData "MYSQL_PASSWORD" | default "" | b64dec) -}}
{{- end -}}
{{- if not $mysqlPwd -}}
{{- $mysqlPwd = randAlphaNum 24 -}}
{{- end -}}

{{/* ---------- Redis 密码 ---------- */}}
{{- $redisPwd := "" -}}
{{- if .Values.middleware.redis.enabled -}}
{{- $redisPwd = .Values.middleware.redis.auth.password -}}
{{- else -}}
{{- $redisPwd = .Values.external.redis.password -}}
{{- end -}}
{{- if not $redisPwd -}}
{{- $redisPwd = (get $prevData "REDIS_PASSWORD" | default "" | b64dec) -}}
{{- end -}}
{{- if not $redisPwd -}}
{{- $redisPwd = randAlphaNum 24 -}}
{{- end -}}

{{/* ---------- pgvector 密码 ---------- */}}
{{- $pgPwd := "" -}}
{{- if .Values.middleware.pgvector.enabled -}}
{{- $pgPwd = .Values.middleware.pgvector.auth.password -}}
{{- else -}}
{{- $pgPwd = .Values.external.pgvector.password -}}
{{- end -}}
{{- if not $pgPwd -}}
{{- $pgPwd = (get $prevData "PG_PASSWORD" | default "" | b64dec) -}}
{{- end -}}
{{- if not $pgPwd -}}
{{- $pgPwd = randAlphaNum 24 -}}
{{- end -}}

{{/* ---------- JWT 密钥 ---------- */}}
{{- $jwt := .Values.app.jwtSecret -}}
{{- if not $jwt -}}
{{- $jwt = (get $prevData "JWT_SECRET" | default "" | b64dec) -}}
{{- end -}}
{{- if not $jwt -}}
{{- $jwt = randAlphaNum 48 -}}
{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "apboa.labels" . | nindent 4 }}
  annotations:
    # 保留原值：upgrade 时通过 lookup 读取并复用，不做轮换
    "helm.sh/resource-policy": keep
type: Opaque
data:
  MYSQL_ROOT_PASSWORD: {{ $mysqlRootPwd | b64enc | quote }}
  MYSQL_PASSWORD: {{ $mysqlPwd | b64enc | quote }}
  REDIS_PASSWORD: {{ $redisPwd | b64enc | quote }}
  PG_PASSWORD: {{ $pgPwd | b64enc | quote }}
  JWT_SECRET: {{ $jwt | b64enc | quote }}
