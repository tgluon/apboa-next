{{- if .Values.middleware.redis.enabled }}
{{- $name := include "apboa.resourceName" (dict "root" . "component" "redis") }}
{{- $persist := .Values.middleware.redis.persistence }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "apboa.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    {{- include "apboa.selectorLabels" (dict "root" . "component" "redis") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "apboa.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  # 数据卷为 RWO，避免滚动更新时同节点抢占
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "apboa.selectorLabels" (dict "root" . "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "apboa.labels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      {{- with include "apboa.imagePullSecrets" . }}{{ . | nindent 6 }}{{- end }}
      automountServiceAccountToken: false
      {{- with include "apboa.podSecurityContext" . }}{{ . | nindent 6 }}{{- end }}
      containers:
        - name: redis
          image: {{ include "apboa.image" (dict "root" . "component" .Values.middleware.redis) }}
          imagePullPolicy: {{ include "apboa.pullPolicy" (dict "root" . "component" .Values.middleware.redis) }}
          command:
            - /bin/sh
            - -c
            - exec redis-server --requirepass "$REDIS_PASSWORD"
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "apboa.secretName" . }}
                  key: REDIS_PASSWORD
            - name: TZ
              value: {{ .Values.global.timezone | quote }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.middleware.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if $persist.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ $persist.existingClaim }}
          {{- else if $persist.enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- if and $persist.enabled (not $persist.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  labels:
    {{- include "apboa.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  accessModes:
    - ReadWriteOnce
  {{- $sc := $persist.storageClass | default .Values.global.storageClass }}
  {{- if $sc }}
  storageClassName: {{ $sc | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $persist.size }}
{{- end }}
{{- end }}
