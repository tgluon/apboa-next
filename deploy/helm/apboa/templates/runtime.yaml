{{- $c := .Values.runtime }}
{{- $name := include "apboa.resourceName" (dict "root" . "component" "runtime") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "apboa.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime
  {{- with $c.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $c.service.type }}
  ports:
    - name: http
      port: {{ $c.service.port }}
      targetPort: http
  selector:
    {{- include "apboa.selectorLabels" (dict "root" . "component" "runtime") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "apboa.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime
spec:
  replicas: {{ $c.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "apboa.selectorLabels" (dict "root" . "component" "runtime") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "apboa.labels" . | nindent 8 }}
        app.kubernetes.io/component: runtime
        {{- with $c.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $c.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with include "apboa.imagePullSecrets" . }}{{ . | nindent 6 }}{{- end }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $c.terminationGracePeriodSeconds }}
      {{- with include "apboa.podSecurityContext" . }}{{ . | nindent 6 }}{{- end }}
      {{- with include "apboa.nodeSelector" (dict "root" . "component" $c) }}{{ . | nindent 6 }}{{- end }}
      {{- with include "apboa.tolerations" (dict "root" . "component" $c) }}{{ . | nindent 6 }}{{- end }}
      {{- with include "apboa.affinity" (dict "root" . "component" $c) }}{{ . | nindent 6 }}{{- end }}
      containers:
        - name: runtime
          image: {{ include "apboa.image" (dict "root" . "component" $c) }}
          imagePullPolicy: {{ include "apboa.pullPolicy" (dict "root" . "component" $c) }}
          ports:
            - name: http
              containerPort: 3061
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: TZ
              value: {{ .Values.global.timezone | quote }}
            # 运行时节点不承载网关数据面（网关由 gateway 组件独立部署）
            - name: GATEWAY_ENABLED
              value: "false"
            {{- include "apboa.envMysql" . | nindent 12 }}
            {{- include "apboa.envRedis" . | nindent 12 }}
            {{- include "apboa.envJwt" . | nindent 12 }}
            {{- include "apboa.envPg" . | nindent 12 }}
            - name: SHELL_PROXY_ENABLED
              value: "true"
            - name: PROXY_HOST
              value: {{ include "apboa.resourceName" (dict "root" . "component" "proxy") | quote }}
            - name: PROXY_PORT
              value: {{ .Values.proxy.service.port | quote }}
            - name: CONSOLE_HOST
              value: {{ include "apboa.consoleHost" . | quote }}
            - name: RUNTIME_JAVA_HEAP_PERCENTAGE
              value: {{ $c.javaHeapPercentage | quote }}
            - name: WORKSPACE_CAPACITY_MB
              value: {{ .Values.app.workspaceCapacityMb | quote }}
            - name: APBOA_STORAGE_MODE
              value: {{ .Values.app.storageMode | quote }}
            {{- if .Values.websocket.enabled }}
            - name: WEBSOCKET_ENABLED
              value: "true"
            - name: WEBSOCKET_HOST
              value: {{ include "apboa.resourceName" (dict "root" . "component" "websocket") | quote }}
            - name: WEBSOCKET_PORT
              value: {{ .Values.websocket.service.port | quote }}
            {{- else }}
            - name: WEBSOCKET_ENABLED
              value: "false"
            {{- end }}
            # Python / Node 依赖安装目录（配合 /opt/tools 持久卷）
            - name: PIP_TARGET
              value: /opt/tools/pylib
            - name: PYTHONPATH
              value: /opt/tools/pylib
            - name: NPM_CONFIG_PREFIX
              value: /opt/tools/npm-global
            {{- include "apboa.envNodeId" . | nindent 12 }}
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if $c.probes.enabled }}
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: {{ $c.probes.startupFailureThreshold }}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: {{ $c.probes.periodSeconds }}
            failureThreshold: 4
          {{- end }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            {{- include "apboa.dataVolumeMount" . | nindent 12 }}
            {{- include "apboa.toolsVolumeMount" (dict "root" . "component" "runtime") | nindent 12 }}
            {{- include "apboa.logsVolumeMount" (dict "root" . "component" "runtime" "path" "/app/logs") | nindent 12 }}
      volumes:
        {{- include "apboa.dataVolume" . | nindent 8 }}
        {{- include "apboa.toolsVolume" . | nindent 8 }}
        {{- include "apboa.logsVolume" . | nindent 8 }}
