{{- $root := . }}
{{- $c := .Values.console }}
{{- $name := include "apboa.resourceName" (dict "root" . "component" "console") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "apboa.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
  {{- with $c.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $c.service.type }}
  ports:
    - name: http
      port: {{ $c.service.port }}
      targetPort: http
  selector:
    {{- include "apboa.selectorLabels" (dict "root" . "component" "console") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "apboa.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  replicas: {{ $c.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 共享 .apboa 卷可能是 RWO，先停后起避免多 Pod 抢占
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "apboa.selectorLabels" (dict "root" . "component" "console") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "apboa.labels" . | nindent 8 }}
        app.kubernetes.io/component: console
        {{- with $c.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $c.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with include "apboa.imagePullSecrets" . }}{{ . | nindent 6 }}{{- end }}
      automountServiceAccountToken: false
      {{- with include "apboa.podSecurityContext" . }}{{ . | nindent 6 }}{{- end }}
      {{- with include "apboa.nodeSelector" (dict "root" . "component" $c) }}{{ . | nindent 6 }}{{- end }}
      {{- with include "apboa.tolerations" (dict "root" . "component" $c) }}{{ . | nindent 6 }}{{- end }}
      {{- with include "apboa.affinity" (dict "root" . "component" $c) }}{{ . | nindent 6 }}{{- end }}
      containers:
        - name: console
          image: {{ include "apboa.image" (dict "root" . "component" $c) }}
          imagePullPolicy: {{ include "apboa.pullPolicy" (dict "root" . "component" $c) }}
          ports:
            - name: http
              containerPort: 3060
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: TZ
              value: {{ .Values.global.timezone | quote }}
            {{- include "apboa.envMysql" . | nindent 12 }}
            {{- include "apboa.envRedis" . | nindent 12 }}
            {{- include "apboa.envJwt" . | nindent 12 }}
            - name: CONSOLE_JAVA_HEAP_PERCENTAGE
              value: {{ $c.javaHeapPercentage | quote }}
            {{- if .Values.websocket.enabled }}
            - name: WEBSOCKET_ENABLED
              value: "true"
            - name: WEBSOCKET_HOST
              value: {{ include "apboa.resourceName" (dict "root" . "component" "websocket") | quote }}
            - name: WEBSOCKET_PORT
              value: {{ .Values.websocket.service.port | quote }}
            {{- else }}
            - name: WEBSOCKET_ENABLED
              value: "false"
            {{- end }}
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if $c.probes.enabled }}
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: {{ $c.probes.startupFailureThreshold }}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: {{ $c.probes.periodSeconds }}
            failureThreshold: 4
          {{- end }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            {{- include "apboa.dataVolumeMount" . | nindent 12 }}
            {{- include "apboa.logsVolumeMount" (dict "root" . "component" "console" "path" "/app/logs") | nindent 12 }}
      volumes:
        {{- include "apboa.dataVolume" . | nindent 8 }}
        {{- include "apboa.logsVolume" . | nindent 8 }}
